services:
  banco:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-chamados}
      POSTGRES_USER: ${DB_USERNAME:-chamados}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-chamados_local}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - dados_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 15

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://banco:5432/${DB_NAME:-chamados}
      DB_USERNAME: ${DB_USERNAME:-chamados}
      DB_PASSWORD: ${DB_PASSWORD:-chamados_local}
    depends_on:
      banco:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/setores?size=1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  dados_postgres:
